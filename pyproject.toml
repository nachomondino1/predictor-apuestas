# Empaquetado mínimo del repo para poder hacer `pip install -e .` y así resolver
# los imports absolutos (`from predictor.utils...`, `from predictor.data_preparation...`)
# sin el viejo `sys.path.append('.')` en cada archivo.
#
# Layout `src/`: todo el código de librería vive en src/predictor/ (ver
# docs/ARQUITECTURA.md). `scripts/`, `analysis/` y `tests/` quedan afuera del
# paquete instalado (no los importa nadie como `predictor.X`, ver REFACTOR.md
# "Estructura de archivos").
#
# Las dependencias NO se declaran acá (siguen en requirements*.txt / requirements_mnm.txt).
# Instalar el proyecto: `pip install -e . --no-deps`
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "predictor-apuestas"
version = "0.0.0"
description = "Predictor de resultados de fútbol para apuestas"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
# El repo usa namespace packages (sin __init__.py)
namespaces = true
include = ["predictor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

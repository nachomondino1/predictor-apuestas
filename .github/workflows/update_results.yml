name: Update results

on:
  schedule: # Se ejecutan en horario UTC 0 (arg es -3) y con 15' de retraso...

    # Todos los dias a la medianoche
    - cron: "00 21 * * *" # 18 hs
    - cron: "00 22 * * *" # 19.00 hs
    
    # Viernes (16:00 hs, 18:00 hs, 18:30 hs)
    - cron: "0 19 * * 5" # 16 ARG (partidos de las 14 hs)
    # - cron: "0 21 * * 5" # 18 ARG (partidos de las 16 hs)
    # - cron: "45 21 * * 5" # 18.45 ARG (partidos de las 16.30 hs)

    # Sabado (10:30 hs, 12:30 hs, 13:00 hs, 14:00 hs, 15:30 hs, 16:00 hs, 18:00 hs, 18:30 hs)
    - cron: "30 13 * * 6"
    - cron: "30 15 * * 6"
    - cron: "0 16 * * 6"
    - cron: "0 17 * * 6"
    - cron: "30 18 * * 6"
    - cron: "0 19 * * 6"
    # - cron: "0 21 * * 6"
    # - cron: "30 21 * * 6"

    # Domingo (12:00 hs, 12:30 hs, 14:00 hs, 14:30 hs, 15:30 hs, 16:00 hs, 18:00 hs, 18:30 hs)
    - cron: "30 15 * * 0"
    - cron: "0 17 * * 0"
    - cron: "30 18 * * 0"
    - cron: "0 19 * * 0"
    # - cron: "0 21 * * 0"
    # - cron: "30 21 * * 0"
  
    # Lunes (15:30 hs, 17:45 hs, 18:30 hs)
    - cron: "30 18 * * 1"
    # - cron: "45 20 * * 1"
    # - cron: "30 21 * * 1"

  push: # Para hacer que se ejecute la action
    branches:
      - staging

jobs:
  collect_results:
    runs-on: ubuntu-latest

    env:
      TZ: America/Argentina/Buenos_Aires
      ENVIRONMENT: "prod"

    # Agrego permisos en job para poder hacer push
    permissions: 
      contents: write  # para poder hacer git push

    steps:
      - name: Print current date and time
        run: date
      
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            set_up_logging.py
            data/df_countries.xlsx
            data/df_competencies.xlsx
            data/historial_predicciones.xlsx
            data/predicciones.xlsx
            p2_data_understanding/collect_initial_data
            p3_data_preparation/construct_data.py
            p3_data_preparation/clean_data.py
            p4_modeling
            p6_deployment/automatize_predict
            p6_deployment/requirements_mnm.txt
          sparse-checkout-cone-mode: false
          ref: prod # Branch

      # Instalacion de dependencias 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
 
      - name: Set up cache for pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/p6_deployment/requirements_mnm.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r p6_deployment/requirements_mnm.txt

      - name: Set n_days based on hour
        id: set-ndays
        run: |
          current_hour=$(date +"%H")  # Hora actual solo HH. Se compara la hora (HH), ignorando los minutos, lo que hace que sea menos sensible a posibles retrasos.
          echo "La hora actual es: $current_hour"
          if [ "$current_hour" == "13" ]; then
            echo "n_days=0.13" >> $GITHUB_ENV
            echo "El valor de n_days es 0.13"
          elif [ "$current_hour" == "15" ]; then
            echo "n_days=0.10" >> $GITHUB_ENV
            echo "El valor de n_days es 0.10"
          elif [ "$current_hour" == "16" ]; then
            echo "n_days=0.21" >> $GITHUB_ENV
            echo "El valor de n_days es 0.21"
          elif [ "$current_hour" == "17" ]; then
            echo "n_days=0.06" >> $GITHUB_ENV
            echo "El valor de n_days es 0.06"
          elif [ "$current_hour" == "18" ]; then
            echo "n_days=0.08" >> $GITHUB_ENV
            echo "El valor de n_days es 0.08"
          elif [ "$current_hour" == "19" ]; then
            echo "n_days=0.04" >> $GITHUB_ENV
            echo "El valor de n_days es 0.04"
          elif [ "$current_hour" == "21" ]; then
            echo "n_days=0.10" >> $GITHUB_ENV
            echo "El valor de n_days es 0.10"
          else
            echo "n_days=1.00" >> $GITHUB_ENV  # Valor predeterminado en caso de error
            echo "El valor predeterminado de n_days es 1"

      # Run update_results script
      - name: Run update_results script
        run: |
          # python p6_deployment/automatize_predict/update_results.py 1
          echo "Ejecutando el script con n_days=${{ env.n_days }}"
          python p6_deployment/automatize_predict/update_results.py ${{ env.n_days }}


      # Push to Github
      - name: Commit and push all changes
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }} # Set the environment variable GITHUB_TOKEN if needed for push authentication
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .  # Agregar todos los cambios
          git commit -m "Update results of bets"
          git push https://x-access-token:${{ secrets.TOKEN }}@github.com/${{ github.repository }} HEAD:prod

      # Dispath to transfer
      - name: Dispatch event to second repository
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        run: |
          python p6_deployment/automatize_predict/dispatch_event/dispatch_event.py

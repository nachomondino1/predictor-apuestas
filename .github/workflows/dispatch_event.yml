name: Dispatch Event

on:
  push:
    paths:
      - p6_deployment/data/predicciones.xlsx

jobs:
  dispatch:
    runs-on: ubuntu-latest

    steps:
    
    - name: Set up Git and sparse checkout
      run: |
        git config --global core.sparseCheckout true
        git init predictor-apuestas
        cd predictor-apuestas
        git remote add origin https://github.com/nachomondino1/predictor-apuestas.git
        echo "p6_deployment/data/predicciones.xlsx" >> .git/info/sparse-checkout
        git fetch origin prod
        git checkout prod

    # - name: Checkout this repository
    #   uses: actions/checkout@v4
    #   with:
    #     ref: prod  # Branch

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies # Por ejemplo, requests
      run: |
        python -m pip install --upgrade pip
        pip install -r dispatch_event/requirements.txt

    - name: Dispatch event to second repository
      env:
        GITHUB_TOKEN: ${{ secrets.TOKEN }}
      run: |
        python dispatch_event/dispatch_event.py

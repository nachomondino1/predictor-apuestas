name: Dispatch de prueba

on:
  push:
    branches:
      - prod  # Asegúrate de que esta acción escuche los eventos de push en 'prod'
    paths:
      - p6_deployment/data/predicciones.xlsx

jobs:
  dispatch:
    runs-on: ubuntu-latest

    steps:
    
    - name: Checkout this repository
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          p6_deployment/data/predicciones.xlsx
          automatize_predict/dispatch_event
        sparse-checkout-cone-mode: false
        ref: prod  # Branch

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies # Por ejemplo, requests
      run: |
        python -m pip install --upgrade pip
        pip install requests  # -r automatize_predict/dispatch_event/requirements.txt

    - name: Dispatch event to second repository
      env:
        GITHUB_TOKEN: ${{ secrets.TOKEN }}
      run: |
        python github_actions/dispatch_event/dispatch_event.py



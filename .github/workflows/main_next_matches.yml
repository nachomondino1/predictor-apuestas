name: Run predictions

on:
  schedule:
    - cron: "0 12 19 5 *"
    - cron: "30 10 18 5 *"
    - cron: "0 16 19 5 *"
    - cron: "45 15 26 5 *"
jobs:

  collect-data-job-0-12-19-5-star-48:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            github_actions/update_workflow/schedules.xlsx
            github_actions/update_workflow/update_workflow.py
            p6_deployment/collect_data.py
          sparse-checkout-cone-mode: false
          ref: prod  # Branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install pandas openpyxl

      - name: Run collect_data script
        run: python p6_deployment/collect_data.py --id_country 48


name: Transfer Excel Files

on:
  push:
    branches:
      - staging
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Transfer files via SCP
      uses: appleboy/scp-action@master # Documentacion: https://github.com/marketplace/actions/ssh-remote-commands
      with:
        host: ${{ secrets.REMOTE_HOST }}
        username: ${{ secrets.REMOTE_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        passphrase: ${{ secrets.PASSPHRASE }}
        source: "p6_deployment/data/historial_predicciones.xlsx"  # el path relativo desde el directorio raíz del repositorio donde se ejecuta la acción
        target: "/usr/local/lsws/Example/html/landing_prueba/landing/populate_excel_to_sql/prueba/"
        port: 22


        
